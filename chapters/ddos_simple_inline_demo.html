<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDoS: Interactive Overload Demonstration</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}*{box-sizing:border-box}body{margin:0;padding:16px}.demo{border:1px solid #ddd;border-radius:32px;max-width:900px;margin:auto;overflow:hidden;background:#fff}.stage{position:relative;height:355px;padding:18px 16px}.stage svg{width:100%;height:100%;display:block}.line{fill:none;stroke-width:3}.blue{stroke:#2695ff}.green{stroke:#00b64a}.gray{stroke:#656565}.dot{fill:#009e43}.bdot{fill:#198dff}.small{font-size:15px}.tiny{font-size:13px}.bold{font-weight:600}.explanation{min-height:96px;background:#f5f5f5;border-top:1px solid #ddd;text-align:center;padding:22px 14px;font:19px Georgia,serif;color:#555}.controls{padding:14px 18px 20px;display:grid;gap:14px}.control{display:grid;grid-template-columns:140px 60px 1fr;align-items:center;gap:10px;font-size:14px}input[type=range]{width:100%;accent-color:#009e43}button{border:1px solid #ddd;background:white;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{background:#f4f4f4}.buttons{display:flex;gap:8px;justify-content:flex-end}.summary{font-size:13px;color:#555;text-align:center}.queuecell{fill:#f0f0f0}.queuecell.full{fill:#f5b94b}.queuecell.over{fill:#e16a55}@media(max-width:600px){body{padding:5px}.demo{border-radius:18px}.stage{height:290px;padding:6px}.control{grid-template-columns:105px 46px 1fr;gap:6px;font-size:12px}.small{font-size:16px}.tiny{font-size:14px}}</style></head><body><main class="demo" aria-label="Interactive DDoS attack demonstration"><div class="stage"><svg viewBox="0 0 840 330" role="img" aria-labelledby="diagramtitle diagramdesc"><title id="diagramtitle">Traffic converging on a limited-capacity server</title><desc id="diagramdesc">Three blue attacker computers and one green legitimate client send traffic to a queue, then to a server with a finite request-processing capacity. Controls below change the traffic and server capacity.</desc>
<text x="55" y="37" fill="#0782f8" class="small">Attack <tspan id="attTop">35</tspan> /s</text><text x="55" y="310" fill="#00a63d" class="small">Legitimate <tspan id="legTop">40</tspan> /s</text>
<g font-size="39"><text x="60" y="100">💻</text><text x="60" y="160">💻</text><text x="60" y="220">💻</text><text x="60" y="280">💻</text></g>
<path d="M110 82 L340 164 M110 142 L340 164 M110 202 L340 164" class="line blue"/><path d="M110 263 L340 172" class="line green"/><path d="M340 168 L450 168" class="line gray"/><path d="M450 168 L490 168" class="line green"/><path d="M540 168 L770 168" class="line gray"/><path d="M758 161 L770 168 L758 175" class="line gray"/>
<g id="movingdots"><circle class="bdot" r="4.5"><animateMotion dur="1.7s" repeatCount="indefinite" path="M110 82 L340 164"/></circle><circle class="bdot" r="4.5"><animateMotion dur="1.3s" repeatCount="indefinite" path="M110 142 L340 164"/></circle><circle class="bdot" r="4.5"><animateMotion dur="1.5s" repeatCount="indefinite" path="M110 202 L340 164"/></circle><circle class="dot" r="4.5"><animateMotion dur="1.5s" repeatCount="indefinite" path="M110 263 L340 172"/></circle><circle class="dot" r="5"><animateMotion dur="2s" repeatCount="indefinite" path="M540 168 L770 168"/></circle></g>
<rect x="340" y="124" width="96" height="64" rx="11" fill="white" stroke="#eee"/><text x="359" y="84" class="tiny" fill="#555">Wait ~<tspan id="wait">0</tspan> s</text><text x="351" y="107" class="tiny bold">Queue <tspan id="queue">0</tspan>/80</text><g id="queueCells"></g>
<g transform="translate(492 129)"><rect width="35" height="48" rx="2" fill="#13b86c" stroke="#087c47" stroke-width="2"/><rect x="5" y="6" width="25" height="9" fill="#008b4c"/><rect x="5" y="20" width="25" height="9" fill="#008b4c"/><rect x="5" y="34" width="25" height="9" fill="#008b4c"/><circle cx="9" cy="11" r="2" fill="#aaffce"/><circle cx="9" cy="25" r="2" fill="#aaffce"/><circle cx="9" cy="39" r="2" fill="#aaffce"/></g><text x="480" y="203" class="tiny bold">Capacity</text><text x="488" y="222" class="tiny bold"><tspan id="capTop">120</tspan> /s</text><text x="676" y="111" class="tiny bold"><tspan id="served">75</tspan> /s served</text>
</svg></div><div class="explanation" id="explanation" aria-live="polite">75 /s arrive within 120 /s capacity, so no backlog grows</div><div class="controls"><div class="control"><label for="attack">Attack traffic</label><output id="attackVal">35 /s</output><input id="attack" type="range" min="0" max="300" step="5" value="35"></div><div class="control"><label for="legit">Legitimate traffic</label><output id="legitVal">40 /s</output><input id="legit" type="range" min="10" max="80" step="5" value="40"></div><div class="control"><label for="capacity">Server capacity</label><output id="capacityVal">120 /s</output><input id="capacity" type="range" min="100" max="300" step="10" value="120"></div><div class="buttons"><button id="reset">Reset</button><button id="simulate">Simulate an attack</button><button id="pause" aria-pressed="false">Pause</button></div><div class="summary">Illustrative model: excess requests fill a finite queue; sustained overload causes requests to be dropped. No real network traffic is generated.</div></div></main><script>
const $=id=>document.getElementById(id), attack=$('attack'),legit=$('legit'),capacity=$('capacity');let backlog=0,paused=false,last=performance.now();const cells=$('queueCells');for(let i=0;i<20;i++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',348+(i%5)*17);r.setAttribute('y',133+Math.floor(i/5)*13);r.setAttribute('width',13);r.setAttribute('height',10);r.setAttribute('rx',3);r.setAttribute('class','queuecell');cells.appendChild(r)}function render(){const a=+attack.value,l=+legit.value,c=+capacity.value,total=a+l,served=Math.min(total,c),excess=Math.max(0,total-c);$('attTop').textContent=a;$('legTop').textContent=l;$('capTop').textContent=c;$('served').textContent=served;$('attackVal').textContent=a+' /s';$('legitVal').textContent=l+' /s';$('capacityVal').textContent=c+' /s';$('queue').textContent=Math.floor(backlog);$('wait').textContent=(backlog/c).toFixed(1);const fill=Math.ceil(backlog/4);[...cells.children].forEach((e,i)=>e.setAttribute('class','queuecell'+(i<fill?(backlog>=80?' over':' full'):'')));$('explanation').textContent=excess===0?`${total} /s arrive within ${c} /s capacity, so no backlog grows`:backlog>=79.9?`${total} /s arrive, but only ${c} /s can be served. The queue is full; requests are dropped.`:`${total} /s arrive but capacity is ${c} /s. Excess traffic fills the waiting queue.`}function tick(t){let dt=Math.min((t-last)/1000,.1);last=t;if(!paused){let rate=+attack.value + +legit.value - +capacity.value;backlog=Math.max(0,Math.min(80,backlog+rate*dt));render()}requestAnimationFrame(tick)}[attack,legit,capacity].forEach(e=>e.addEventListener('input',render));$('reset').onclick=()=>{attack.value=35;legit.value=40;capacity.value=120;backlog=0;render()};$('simulate').onclick=()=>{attack.value=200;backlog=0;render()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('pause').setAttribute('aria-pressed',String(paused));$('movingdots').style.display=paused?'none':''};render();requestAnimationFrame(tick);
</script></body></html>
